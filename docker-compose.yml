version: '3.8'

# Шаблон ограничений для логов (максимум 3 файла по 200 Мб на сервис = 600 Мб)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "200m"
    max-file: "3"

services:
  timescaledb:
    image: ${TIMESCALE_IMAGE:-timescale/timescaledb-ha:pg16.14-ts2.27.1-all}
    container_name: timescaledb
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-j0lxEv0sljXa}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-mirror.gcr.io/library/python:3.12}
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        NO_PROXY: ${NO_PROXY}
        no_proxy: ${no_proxy}
    depends_on:
      timescaledb:
        condition: service_healthy
    logging: *default-logging
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-j0lxEv0sljXa}@timescaledb:5432/${POSTGRES_DB:-app_db}
      API_AUTH_KEY: "pcrt!af3g"
      API_DEV_MODE: "true"
    restart: unless-stopped
    ports:
      - "8000:8000"

  gps-egts:
    build:
      context: .
      dockerfile: gps/Dockerfile
    depends_on:
      timescaledb:
        condition: service_healthy
    logging: *default-logging
    environment:
      GPS_DATABASE_DSN: postgres://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-j0lxEv0sljXa}@timescaledb:5432/${POSTGRES_DB:-app_db}?sslmode=disable
      GPS_EGTS_HOST: 0.0.0.0
      GPS_EGTS_PORT: 4000
      GPS_EGTS_DISPATCHER_HOST: egts.gortransportnch.ru
      GPS_HEALTH_HOST: 0.0.0.0
      GPS_HEALTH_PORT: 8001
      GPS_LOG_LEVEL: info
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "8001:8001"

volumes:
  timescaledb_data: