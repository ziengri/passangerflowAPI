services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-mirror.gcr.io/library/python:3.12}
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      API_AUTH_KEY: "pcrt!af3g"
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data

